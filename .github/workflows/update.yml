name: Aktualizacja rozkładów

on:
  schedule:
    - cron: '30 2 * * *'   # codziennie ok. 4:30 czasu polskiego
    - cron: '15 * * * *'   # co godzinę: tylko gdy jakieś źródło było niedostępne (data/brak_zrodel.json)
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

# (one run at a time: an hourly try waits for a build still running)
concurrency:
  group: aktualizacja
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # the hourly runs build only while a source is missing; the daily one and a run started by hand always
      - name: Czy budować
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ -s data/brak_zrodel.json ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "Wszystkie źródła były dostępne – nic do zrobienia."
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.12'
      # the last copy of each source fetched, used when a source cannot be fetched (build.py)
      - name: Ostatnie pobrane kopie źródeł
        if: steps.gate.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: cache/zrodla
          key: zrodla-${{ github.run_id }}
          restore-keys: zrodla-
      - name: Narzędzia LOOM do schematu oktylinearnego (z pamięci podręcznej)
        if: steps.gate.outputs.go == '1'
        id: loom
        uses: actions/cache@v4
        with:
          path: loom-bin
          key: loom-bin-v1
      - name: Zbuduj LOOM (tylko za pierwszym razem)
        if: steps.gate.outputs.go == '1' && steps.loom.outputs.cache-hit != 'true'
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/ad-freiburg/loom.git /tmp/loom
          # the tools do not need LOOM's own tests, which take most of the build time
          for d in topo loom octi; do
            sed -i "s|file(GLOB_RECURSE ${d}_SRC \*.cpp)|&\nlist(FILTER ${d}_SRC EXCLUDE REGEX \".*/tests/.*\")|" /tmp/loom/src/$d/CMakeLists.txt
          done
          cmake -S /tmp/loom -B /tmp/loom/build -DCMAKE_BUILD_TYPE=Release
          make -C /tmp/loom/build -j4 topo loom octi
          mkdir -p loom-bin && cp /tmp/loom/build/topo /tmp/loom/build/loom /tmp/loom/build/octi loom-bin/
      - name: Pobierz otwarte dane i wygeneruj rozkłady
        if: steps.gate.outputs.go == '1'
        env:
          LOOM_BIN: ${{ github.workspace }}/loom-bin
        run: python3 build.py data
      - name: Zapisz zmiany
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "rozklady-bot"
          git config user.email "rozklady-bot@users.noreply.github.com"
          git add data reczne/drogi_cache.json reczne/dopasowanie_cache.json reczne/petle_cache.json
          git diff --cached --quiet || git commit -m "Aktualizacja rozkładów $(date +%F)"
          # someone may have pushed while the data was being built (that takes long): their changes first, then ours on
          # top; where both changed the same generated file, this run's version (the newest data) wins
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
