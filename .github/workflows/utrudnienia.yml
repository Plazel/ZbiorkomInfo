name: Utrudnienia

# Notices of disruptions, every hour: BVG's for Berlin (bvg_utrudnienia.py) and those of PID, ZTM Poznań, ZDMiKP,
# MPK Nowy Sącz and MZK Wejherowo (utrudnienia_miast.py); only data/alerts_*.json, committed when they changed
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utrudnienia
  cancel-in-progress: false

jobs:
  bvg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz komunikaty
        run: |
          python3 bvg_utrudnienia.py data || true
          python3 utrudnienia_miast.py data || true
      - name: Zapisz zmiany
        run: |
          git config user.name "rozklady-bot"
          git config user.email "rozklady-bot@users.noreply.github.com"
          git add data/alerts_*.json
          git diff --cached --quiet && exit 0
          git commit -m "Utrudnienia $(date +%F\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
