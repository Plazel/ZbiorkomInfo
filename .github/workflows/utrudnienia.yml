name: Utrudnienia

# Notices of disruptions, every hour: BVG's for Berlin (bvg_utrudnienia.py) and those of PID, ZTM Poznań, ZDMiKP,
# MPK Nowy Sącz and MZK Wejherowo (utrudnienia_miast.py), then all notices translated into the page's languages
# (tlumacz_komunikaty.py: Argos Translate's free open models, run here); data/alerts_*.json and data/tl/, committed when changed
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utrudnienia
  cancel-in-progress: false

jobs:
  bvg:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz komunikaty
        run: |
          python3 bvg_utrudnienia.py data || true
          python3 utrudnienia_miast.py data || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/argos-ct2
          key: argos-ct2-v1
      - name: Przetłumacz komunikaty
        run: |
          pip install -q ctranslate2 sentencepiece "sacremoses>=0.0.53,<0.2" && pip install -q --no-deps argostranslate==1.11.0 || true
          python3 tlumacz_komunikaty.py data || true
      - name: Zapisz zmiany
        run: |
          git config user.name "rozklady-bot"
          git config user.email "rozklady-bot@users.noreply.github.com"
          git add data/alerts_*.json data/tl
          git diff --cached --quiet && exit 0
          git commit -m "Utrudnienia $(date +%F\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
