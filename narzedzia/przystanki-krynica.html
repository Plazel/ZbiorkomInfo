<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Przystanki Krynicy i Muszyny</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--fg:#1d2126;--muted:#5d6670;--line:#d5dae0;--panel:#f3f5f7;--brand:#d71920}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Roboto,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:48% 52%}.side{order:2}}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.head{padding:10px 12px;border-bottom:1px solid var(--line)}.head h1{font-size:1.05rem;margin:0 0 4px}.head p{margin:0;font-size:.8rem;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
button,input,textarea,select{font:inherit}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 10px;cursor:pointer}.btn:hover{background:var(--panel)}.btn.pri{background:var(--fg);color:#fff;border-color:var(--fg)}
#q{flex:1;min-width:120px;border:1px solid var(--line);padding:6px 8px}
#q:focus,textarea:focus,input:focus{outline:none;border-color:var(--fg)}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
li{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
li:hover{background:var(--panel)}li.on{background:#fff4c2}
li .n{flex:1;min-width:0}li .m{font-size:.75rem;color:var(--muted)}
.dot{width:10px;height:10px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #888}
.done .dot{background:#1f9a3e}.todo .dot{background:#e8a400}
.edit{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px;background:var(--panel)}
.edit[hidden]{display:none}.dirs{font-size:.85rem;display:grid;gap:4px}.dirs div{display:flex;gap:6px;align-items:baseline}.dirs b{white-space:nowrap}.dirs i{font-style:normal;display:inline-block;width:12px;height:12px;flex:none;border-radius:50%;align-self:center}.edit b{font-size:.95rem}.edit .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.edit input[type=text]{width:64px;border:1px solid var(--line);padding:5px 6px}.edit textarea{width:100%;min-height:54px;border:1px solid var(--line);padding:6px}
#map{height:100%;min-height:0}
.pm{background:none;border:0}.pm span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #2f63ad;font:700 11px Roboto,sans-serif;color:#2f63ad;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pm.sel span{border-color:var(--brand);color:var(--brand);transform:scale(1.25)}.pm.done span{border-color:#1f9a3e;color:#1f9a3e}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:8px 14px;z-index:9999;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
 <div class="side">
  <div class="head"><h1>Przystanki Krynicy-Zdroju i Muszyny</h1>
   <p>Wybierz przystanek z listy lub na mapie i przeciągnij jego znacznik w dokładne miejsce na zdjęciu. Przystanek po obu stronach ulicy: „Dodaj drugi peron” i ustaw oba. Postęp zapisuje się w tej przeglądarce; na koniec pobierz plik i prześlij go.</p></div>
  <div class="tools"><input id="q" type="search" placeholder="Szukaj przystanku"><select id="flt" class="btn"><option value="">Wszystkie</option><option value="todo">Do sprawdzenia</option><option value="done">Gotowe</option></select>
   <button class="btn" id="layer" type="button">Mapa / zdjęcie</button><button class="btn pri" id="exp" type="button">Pobierz plik</button><button class="btn" id="copy" type="button">Kopiuj</button></div>
  <ul id="list"></ul>
  <div class="edit" id="edit" hidden>
   <b id="eName"></b>
   <div class="row" id="ePoles"></div>
   <div class="row"><button class="btn" id="addPole" type="button">Dodaj drugi peron</button><button class="btn" id="delPole" type="button">Usuń drugi peron</button><label><input type="checkbox" id="eDone"> gotowe</label></div>
   <div class="dirs" id="eDirs"></div>
   <textarea id="eNote" placeholder="Uwagi (np. przystanek nie istnieje, inna nazwa, tylko w jednym kierunku)"></textarea>
  </div>
 </div>
 <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY='kmStops.v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)};
const map=L.map('map',{zoomControl:true,maxZoom:21}).setView([49.42,20.95],13);
const photo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'Zdjęcie: Esri, Maxar, Earthstar Geographics'});
const CK='cb1_4vdw_1_23a15f607749c4261b38e021';
const labels=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png?key='+CK,{maxZoom:21,maxNativeZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap, © CARTO'});
const plain=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key='+CK,{maxZoom:21,maxNativeZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap, © CARTO'});
photo.addTo(map);labels.addTo(map);let isPhoto=true;
document.getElementById('layer').onclick=()=>{if(isPhoto){map.removeLayer(photo);map.removeLayer(labels);plain.addTo(map)}else{map.removeLayer(plain);photo.addTo(map);labels.addTo(map)}isPhoto=!isPhoto};
let STOPS=[],LINES={},SEL=null,DIRS={};const MK={};let ARROWS=[];
const DCOL=['#d71920','#1f6fd1','#1f9a3e','#8e24aa','#e8a400','#00838f'];
const icon=(t,cls)=>L.divIcon({className:'pm '+(cls||''),html:'<span>'+t+'</span>',iconSize:[30,30],iconAnchor:[15,15]});
const st=id=>S[id]||(S[id]={poles:[{p:'',lat:null,lon:null}],note:'',done:false});
function poles(s){const x=st(s.id);return x.poles.map((p,i)=>({p:p.p||(x.poles.length>1?['01','02'][i]:s.pole||''),lat:p.lat!=null?p.lat:s.lat+(i?0.00012:0),lon:p.lon!=null?p.lon:s.lon+(i?0.00012:0)}))}
function drawMarkers(){Object.values(MK).flat().forEach(m=>map.removeLayer(m));for(const k in MK)delete MK[k];
  STOPS.forEach(s=>{const x=st(s.id);MK[s.id]=poles(s).map((P,i)=>{const m=L.marker([P.lat,P.lon],{icon:icon(P.p||'•',(SEL===s.id?'sel ':'')+(x.done?'done':'')),draggable:true,title:s.name+(P.p?' '+P.p:'')}).addTo(map);
    m.on('click',()=>select(s.id,false));
    m.on('dragend',()=>{const ll=m.getLatLng();x.poles[i]=x.poles[i]||{p:''};x.poles[i].lat=+ll.lat.toFixed(6);x.poles[i].lon=+ll.lng.toFixed(6);if(!x.poles[i].p&&x.poles.length>1)x.poles[i].p=['01','02'][i];save();select(s.id,false)});
    return m})})}
function list(){const q=document.getElementById('q').value.trim().toLowerCase(),f=document.getElementById('flt').value;const ul=document.getElementById('list');ul.innerHTML='';
  STOPS.filter(s=>(!q||s.name.toLowerCase().includes(q))&&(!f||(f==='done')===!!st(s.id).done)).forEach(s=>{const li=document.createElement('li');const x=st(s.id);
    li.className=(x.done?'done':'todo')+(SEL===s.id?' on':'');li.innerHTML='<span class="dot"></span><span class="n"></span>';li.querySelector('.n').innerHTML='';
    const n=document.createElement('div');n.textContent=s.name;const m=document.createElement('div');m.className='m';m.textContent=(s.pole?'peron '+s.pole+' · ':'')+'linie '+(LINES[s.name]||[]).join(', ')+(x.poles.length>1?' · 2 perony':'')+(x.note?' · uwagi':'');
    li.querySelector('.n').append(n,m);li.onclick=()=>select(s.id,true);ul.appendChild(li)})}
function select(id,fly){SEL=id;const s=STOPS.find(x=>x.id===id);const x=st(id);const E=document.getElementById('edit');E.hidden=false;
  document.getElementById('eName').textContent=s.name+' ('+id+')';
  const pr=document.getElementById('ePoles');pr.innerHTML='Numer peronu: ';poles(s).forEach((P,i)=>{const inp=document.createElement('input');inp.type='text';inp.value=P.p;inp.placeholder=i?'02':'01';
    inp.onchange=()=>{x.poles[i]=x.poles[i]||{lat:null,lon:null};x.poles[i].p=inp.value.trim();save();drawMarkers()};pr.appendChild(inp)});
  document.getElementById('delPole').hidden=x.poles.length<2;document.getElementById('addPole').hidden=x.poles.length>1;
  document.getElementById('eDone').checked=!!x.done;document.getElementById('eNote').value=x.note||'';
  // where the buses go from here: an arrow to the next stop for each direction, listed with its lines and terminus
  ARROWS.forEach(a=>map.removeLayer(a));ARROWS=[];const D=[];Object.values(DIRS['@'+id]||{}).forEach(d=>{if(d.next===s.name)return;const m=D.find(x=>x.next===d.next);if(!m){D.push({...d,heads:Object.fromEntries(Object.entries(d.heads).map(([h,l])=>[h,new Set(l)]))});return}Object.entries(d.heads).forEach(([h,l])=>l.forEach(n=>(m.heads[h]=m.heads[h]||new Set()).add(n)))});const P0=poles(s)[0];
  document.getElementById('eDirs').innerHTML=D.length?'<b>Odjazdy w kierunku:</b>'+D.map((d,i)=>`<div><i style="background:${DCOL[i%DCOL.length]}"></i><span>→ ${Object.entries(d.heads).map(([h,l])=>`<b>${h}</b> (${[...l].join(', ')})`).join(', ')}</span></div>`).join(''):'<span>Przystanek końcowy (brak odjazdów dalej).</span>';
  D.forEach((d,i)=>{const n=STOPS.find(x=>x.all.includes(d.nid));const to=n?poles(n)[0]:{lat:d.lat,lon:d.lon};const col=DCOL[i%DCOL.length];
    const f=Math.min(1,0.0012/Math.max(1e-6,Math.hypot(to.lat-P0.lat,(to.lon-P0.lon)*.65)));const end=[P0.lat+(to.lat-P0.lat)*f,P0.lon+(to.lon-P0.lon)*f];
    ARROWS.push(L.polyline([[P0.lat,P0.lon],end],{color:col,weight:5,opacity:.9,interactive:false}).addTo(map));
    ARROWS.push(L.polyline([[P0.lat,P0.lon],[to.lat,to.lon]],{color:col,weight:2,opacity:.7,dashArray:'4 6',interactive:false}).addTo(map));
    ARROWS.push(L.circleMarker(end,{radius:5,color:col,fillColor:col,fillOpacity:1,interactive:false}).addTo(map))});
  drawMarkers();list();if(fly){const P=poles(s)[0];map.setView([P.lat,P.lon],Math.max(map.getZoom(),18))}}
document.getElementById('addPole').onclick=()=>{if(!SEL)return;const s=STOPS.find(x=>x.id===SEL);const x=st(SEL);const P=poles(s)[0];
  x.poles[0]={p:x.poles[0].p||'01',lat:P.lat,lon:P.lon};x.poles[1]={p:'02',lat:P.lat+0.00012,lon:P.lon+0.00012};save();select(SEL,false)};
document.getElementById('delPole').onclick=()=>{if(!SEL)return;const x=st(SEL);x.poles=x.poles.slice(0,1);save();select(SEL,false)};
document.getElementById('eDone').onchange=e=>{if(!SEL)return;st(SEL).done=e.target.checked;save();select(SEL,false)};
document.getElementById('eNote').oninput=e=>{if(!SEL)return;st(SEL).note=e.target.value;save()};
document.getElementById('q').oninput=list;document.getElementById('flt').onchange=list;
function exportData(){const out={made:new Date().toISOString(),stops:{}};STOPS.forEach(s=>{const x=S[s.id];if(!x)return;const moved=x.poles.some(p=>p.lat!=null);if(!moved&&!x.note&&!x.done&&x.poles.length<2)return;
  out.stops[s.id]={name:s.name,ids:s.ids,poles:poles(s).map(P=>({p:P.p,lat:+P.lat.toFixed(6),lon:+P.lon.toFixed(6)})),note:x.note||'',done:!!x.done}});return JSON.stringify(out,null,1)}
document.getElementById('exp').onclick=()=>{const b=new Blob([exportData()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='przystanki-krynica.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(exportData());toast('Skopiowano – wklej w rozmowie')}catch(e){toast('Nie udało się skopiować – użyj „Pobierz plik”')}};
Promise.all([fetch('../data/index.json').then(r=>r.json()),fetch('../data/map.json').then(r=>r.json()).catch(()=>null),fetch('../data/rp/km_0.json').then(r=>r.json()).catch(()=>({}))]).then(([I,M,RP])=>{
  // the direction of a line is the terminus of its basic variant: the course most runs take (the longest when equal)
  Object.values(RP).forEach(R=>(R.dirs||[]).forEach(d=>{const ids=d.stops.map(x=>x[0]);const cnt={};
    (d.plans||[]).forEach(pl=>(pl||[]).forEach(x=>{const pr=(d.prof||[])[x[1]];if(pr)cnt[pr[0]]=(cnt[pr[0]]||0)+1}));
    let bp=0;(d.pats||[]).forEach((pt,i)=>{const c=cnt[i]||0,cb=cnt[bp]||0;if(c>cb||(c===cb&&pt.length>(d.pats[bp]||[]).length))bp=i});
    const bpt=(d.pats||[])[bp];const tid=bpt?ids[bpt[bpt.length-1]]:ids[ids.length-1];const head=I.stops[tid]?I.stops[tid][0]:d.head;
    (d.pats||[]).forEach(pt=>{for(let j=0;j<pt.length-1;j++){const a=ids[pt[j]],b=ids[pt[j+1]];if(!a||!b||a===b)continue;const B=I.stops[b];if(!B)continue;
      const o=(DIRS[a]=DIRS[a]||{});const e=o[b]||(o[b]={nid:b,next:B[0],lat:B[2],lon:B[3],lines:new Set(),heads:{}});e.lines.add(R.n);(e.heads[head]=e.heads[head]||new Set()).add(R.n)}})}));
  // one entry per stop: the ids of one name close together (data from several sources, and the platforms the timetables
  // derive per direction, e.g. 9a/9b) are one stop here; its second platform is added by hand where it really is one
  const base=k=>k.replace(/_[ab]$/,'');const B={};
  Object.entries(I.stops).forEach(([k,v])=>{if(!/^km/.test(k))return;const b=base(k);if(!B[b])B[b]={id:b,name:v[0],lat:v[2],lon:v[3],all:[]};B[b].all.push(k)});
  const E=[];Object.values(B).forEach(b=>{let e=E.find(x=>x.name===b.name&&Math.hypot(x.lat-b.lat,(x.lon-b.lon)*.65)<.0015);
    if(!e){e={id:b.id,name:b.name,pole:'',lat:b.lat,lon:b.lon,ids:[],all:[]};E.push(e)}e.ids.push(b.id);e.all.push(...b.all)});
  STOPS=E.sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  // the directions of an entry: those of all its ids
  STOPS.forEach(e=>{const m={};e.all.forEach(k=>Object.assign(m,DIRS[k]||{}));DIRS['@'+e.id]=m});
  I.routes.filter(r=>(r.c||[]).includes('km')||(r.c||[]).includes('kmx')).forEach(r=>(r.sn||[]).forEach(n=>(LINES[n]=LINES[n]||[]).includes(r.n)||LINES[n].push(r.n)));
  // the lines' courses, thin, as a guide
  if(M)Object.entries(M.routes).forEach(([id,R])=>{if(!/^km/.test(id))return;(R.g||[]).forEach(c=>{const pts=[];let x=0,y=0;for(let i=0;i<c.length;i+=2){x+=c[i];y+=c[i+1];const X=x/100,Y=y/100;pts.push([-Y/1000,X/(Math.cos(54.45*Math.PI/180)*1000)])}L.polyline(pts,{color:'#ffeb3b',weight:2,opacity:.8,interactive:false}).addTo(map)})});
  const b=L.latLngBounds(STOPS.map(s=>[s.lat,s.lon]));map.fitBounds(b,{padding:[20,20]});drawMarkers();list()});
</script>
</body>
</html>
