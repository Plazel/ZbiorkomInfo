function components(g){let c=0;for(const id of g.adj.keys()){if(g.comp.has(id))continue;let n=0;const q=[id];g.comp.set(id,c);while(q.length){const u=q.pop();n++;for(const [v] of g.adj.get(u)||[]){if(!g.comp.has(v)){g.comp.set(v,c);q.push(v)}}}g.size[c++]=n}g.min=Math.min(30,Math.max(1,...g.size))}
const mdist=(p,q)=>Math.hypot((p[0]-q[0])*111000,(p[1]-q[1])*65000),MAXD=150;
function bridge(g,maxd){const cell=new Map(),ck=(a,b)=>a+','+b,fa=p=>Math.floor(p[0]/.00015),fb=p=>Math.floor(p[1]/.00025);
 for(const id of g.adj.keys()){const p=g.pos.get(id),k=ck(fa(p),fb(p));if(!cell.has(k))cell.set(k,[]);cell.get(k).push(id)}
 let n=0;
 for(const id of g.adj.keys()){const p=g.pos.get(id),c=g.comp.get(id),a=fa(p),b=fb(p);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)for(const o of cell.get(ck(a+i,b+j))||[]){
   if(o<=id||g.comp.get(o)===c)continue;const d=mdist(p,g.pos.get(o));
   if(d<maxd){g.adj.get(id).push([o,d]);g.adj.get(o).push([id,d]);n++}}}

function bestPerComp(ll,g=G){const m=new Map();for(const id of g.adj.keys()){const c=g.comp.get(id);if(g.size[c]<g.min&&!g.keep.has(c))continue;const d=mdist(g.pos.get(id),ll),o=m.get(c);if(!o||d<o[1])m.set(c,[id,d])}return m}
function nearest(ll){let b=null,bm=null;
 for(const [n,d] of bestPerComp(ll).values()){if(!b||d<b[1])b=[n,d];if(G.size[G.comp.get(n)]>=50&&(!bm||d<bm[1]))bm=[n,d]}
 // małe, odizolowane fragmenty torów (bocznice, pojedyncze odcinki) nie są dobrym punktem startu, jeśli w pobliżu (60 m) jest główna sieć
 if(bm&&b&&bm[1]<60)b=bm;return b?b[0]:null}
function cands(ll,g,maxd,K=16){
 const all=[];for(const id of g.adj.keys()){const c=g.comp.get(id);if(g.size[c]<g.min&&!g.keep.has(c))continue;const d=mdist(g.pos.get(id),ll);if(d<maxd)all.push([id,d])}

 for(const x of all){if(out.length>=K)break;if(out.every(o=>mdist(g.pos.get(o[0]),g.pos.get(x[0]))>2))out.push(x)}
 return out}
function tramRoute(a,b,maxd=MAXD,g=G,draw=false){
 if(!g)return{err:'torowiska niewczytane'};
 {const CA=cands(a,g,maxd);const CB=cands(b,g,maxd);
  // rysowanie: początek odcinka to dokładnie koniec poprzedniego (ten sam tor), a koniec wybierany wg najkrótszej drogi po bieżącym torze, nie wg najbliższego węzła (tor przeciwnego kierunku bywa bliżej kliknięcia)
  if(CA.length&&CB.length){
   // trasa łączona wirtualnymi węzłami: kara za dojście do toru, dzięki czemu wybierana jest właściwa odnoga, a nie najbliższy węzeł
   const PEN=1.6,PB=draw?1.05:PEN,VS=-1,VT=-2,added=[];
   g.adj.set(VS,CA.map(([n,d])=>[n,draw?(d<3?0:d*4):d*PEN])); // rysowanie: punkt startu leży na torze – inne tory (np. przeciwnego kierunku) są mocno karane, ale nie wykluczone
   CB.forEach(([n,d])=>{g.adj.get(n).push([VT,d*PB]);added.push(n)});
   let p=null;try{p=dijkstra(VS,VT,g)}finally{g.adj.delete(VS);added.forEach(n=>{const l=g.adj.get(n);for(let i=l.length-1;i>=0;i--)if(l[i][0]===VT){l.splice(i,1);break}})}
   if(p){const ids=p.slice(1,-1);if(ids.length){const pts=ids.map(id=>g.pos.get(id));
    if(!draw){if(mdist(a,pts[0])>3)pts.unshift(a);if(mdist(b,pts[pts.length-1])>3)pts.push(b)}return{pts}}}}}
 const A=bestPerComp(a,g),B=bestPerComp(b,g);if(!A.size)return{err:'brak torów w danych'};
 let best=null,bs=1e18,da=1e18,db=1e18;
 for(const [,d] of A.values())da=Math.min(da,d);for(const [,d] of B.values())db=Math.min(db,d);
 for(const [c,[n,d]] of A){const o=B.get(c);if(o&&d<maxd&&o[1]<maxd&&d+o[1]<bs){bs=d+o[1];best=[n,o[0]]}}

function dijkstra(s,t,g=G){
 const dist=new Map([[s,0]]),prev=new Map(),h=[[0,s]];
 const push=x=>{h.push(x);let i=h.length-1;while(i){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p}};
 const pop=()=>{const top=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){let a=2*i+1,b=a+1,m=i;if(a<h.length&&h[a][0]<h[m][0])m=a;if(b<h.length&&h[b][0]<h[m][0])m=b;if(m==i)break;[h[m],h[i]]=[h[i],h[m]];i=m}}return top};
 while(h.length){const [d,u]=pop();if(u===t)break;if(d>dist.get(u))continue;
  for(const [v,w] of g.adj.get(u)||[]){const nd=d+w;if(nd<(dist.has(v)?dist.get(v):1e18)){dist.set(v,nd);prev.set(v,u);push([nd,v])}}}

const OSRMS=['https://router.project-osrm.org/route/v1/driving/','https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
async function osrm(a,b){let last;for(const base of OSRMS){const h=new URL(base).host,ac=new AbortController(),to=setTimeout(()=>ac.abort(),12000);

  if(j.routes&&j.routes[0])return j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);last=new Error((j.code||'brak trasy')+' @'+h)}
 catch(e){last=new Error((e.name==='AbortError'?'przekroczono czas':e.message)+' @'+h)}finally{clearTimeout(to)}}throw last}

 if(UI.closed||UI.ow){try{return await closedRoute(a,b)}catch(e){if(e.cwFetch)fb={kind:e.cwTimeout?'timeout':'error',msg:e.message};else nf=e.message;const nm=UI.closed?'zamknięte drogi':'ignorowanie jednokierunkowości';CLNOTE=nm+' niedostępne ('+e.message+') – użyto zwykłego trasowania.';dbg('Routing lokalny ('+nm+'): '+e.message+' – zwykłe trasowanie')}}

function nearOn(pts,ll){let best=null,bd=1e9;const px=ll[1]*RX,py=ll[0]*R0;
 for(let i=1;i<pts.length;i++){const x0=pts[i-1][1]*RX,y0=pts[i-1][0]*R0,dx=pts[i][1]*RX-x0,dy=pts[i][0]*R0-y0,L2=dx*dx+dy*dy;let t=L2?((px-x0)*dx+(py-y0)*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(px-(x0+t*dx),py-(y0+t*dy));if(d<bd){bd=d;best=[(y0+t*dy)/R0,(x0+t*dx)/RX]}}

// ---- trasa tekstowa: linia wytyczona z listy ulic (OSM: ulice o tych nazwach w obszarze miasta), przystanki dobierane wzdłuż niej
// przebieg: każda ulica od miejsca wjazdu do skrzyżowania z następną (kierunek jazdy zgodny z jednokierunkowością jezdni – po prawej),
// przystanki leżące przy tym przebiegu (z dwóch peronów o tej samej nazwie ten po prawej stronie jazdy), odcinki między przystankami
// wyznaczane zwykłym trasowaniem; gdy trasowanie odbiega od podanych ulic, odcinek biegnie wzdłuż ulicy
const TXT={};
const txF=s=>String(s||'').toLocaleLowerCase('pl').replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const txNorm=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/^(ul\.?|ulica|al\.?|aleja|aleje|pl\.?|plac|os\.?|osiedle|rondo|skwer)\s+/i,'');
const txKey=s=>txF(txNorm(s)).replace(/[^\p{L}\d]+/gu,' ').trim();
const txSplit=t=>String(t||'').split(/\n|;|,(?!\d)|\s+[–—-]\s+|→/).map(txNorm).filter(Boolean);
async function txWays(names){const want=[...new Set(names.map(txKey))].filter(Boolean),k=want.join('|')+'@'+bb();if(TXT[k])return TXT[k];
 const esq=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\\\$&').replace(/"/g,'\\"');
 const alt=`^((aleja|aleje|ulica|plac|rondo|skwer|osiedle|al\\\\.|ul\\\\.|pl\\\\.|os\\\\.) )?(${[...new Set(names.map(txNorm))].map(esq).join('|')})$`;
 const j=await ov(`[out:json][timeout:120];way["highway"]["highway"!~"^(footway|path|cycleway|steps|pedestrian|track|bridleway|corridor|elevator|proposed|construction)$"]["name"~"${alt}",i](${bb()});out body geom;`,130000);
 const W=(j.elements||[]).filter(e=>e.geometry&&e.nodes&&e.geometry.length===e.nodes.length).map(e=>({key:txKey((e.tags||{}).name),ow:(e.tags||{}).oneway==='yes'||(e.tags||{}).junction==='roundabout'?1:(e.tags||{}).oneway==='-1'?-1:0,nodes:e.nodes,pts:e.geometry.map(p=>[p.lat,p.lon])}));

// graf jednej ulicy (wszystkie drogi o tej nazwie); kierunek jednokierunkowych jezdni zachowany (dir), wersja bez kierunków (und) – gdy z kierunkiem się nie da
function txGraph(ways){const pos=new Map(),dir=new Map(),und=new Map(),add=(m,a,b,d)=>{let x=m.get(a);if(!x)m.set(a,x=[]);x.push([b,d])};

  add(und,a,b,d);add(und,b,a,d);if(w.ow!==-1)add(dir,a,b,d);if(w.ow!==1)add(dir,b,a,d)}});
 return{pos,dir,und}}
function txDij(adj,s,t){const g={adj};if(t!=null)return dijkstra(s,t,g);

const txRev=adj=>{const r=new Map();adj.forEach((es,a)=>es.forEach(([b,d])=>{let x=r.get(b);if(!x)r.set(b,x=[]);x.push([a,d])}));return r};
const txNear=(pos,ll)=>{let b=null,bd=1e18;pos.forEach((p,id)=>{const d=mdist(p,ll);if(d<bd){bd=d;b=id}});return[b,bd]};
// węzeł ulicy przy punkcie, z którego (do którego) da się dojechać zgodnie z kierunkiem jezdni – przy dwóch jezdniach wybiera właściwą
const txSnap=(g,ll,other,start)=>{const c=[];g.pos.forEach((p,id)=>c.push([mdist(p,ll),id]));c.sort((a,b)=>a[0]-b[0]);const best=c[0]?c[0][1]:null;if(other==null)return best;
 for(const [d,id] of c.slice(0,16)){if(d>c[0][0]+40)break;if(start?txDij(g.dir,id,other):txDij(g.dir,other,id))return id}return best};
// przebieg wzdłuż ulic: [{ll}], kolejne ulice łączone w najbliższym miejscu (wspólny węzeł albo najbliższe punkty, do 150 m)
function txGuide(ways,names,from,to,pin={}){const G=names.map(n=>{const k=txKey(n),w=ways.filter(x=>x.key===k);if(!w.length)throw new Error(`Nie znaleziono ulicy „${n}” w obszarze ${CITIES[cityKey()].n.replace(/ \(.*/,'')}.`);return txGraph(w)});
 const J=[];for(let i=0;i+1<G.length;i++){const A=G[i],B=G[i+1];let best=null,bd=1e18;
  for(const [id,p] of A.pos){if(B.pos.has(id)){best=[id,id];bd=0;break}}
  if(!best){const cell=new Map(),ck=p=>Math.floor(p[0]/.0015)+':'+Math.floor(p[1]/.0025);B.pos.forEach((p,id)=>{const k=ck(p);let x=cell.get(k);if(!x)cell.set(k,x=[]);x.push(id)});
   A.pos.forEach((p,id)=>{const a=Math.floor(p[0]/.0015),b=Math.floor(p[1]/.0025);for(let u=-1;u<=1;u++)for(let v=-1;v<=1;v++)for(const q of cell.get((a+u)+':'+(b+v))||[]){const d=mdist(p,B.pos.get(q));if(d<bd){bd=d;best=[id,q]}}})}
  if(!best||bd>150)throw new Error(`Ulice „${names[i]}” i „${names[i+1]}” nie łączą się ze sobą (najbliżej ${best?Math.round(bd)+' m':'– brak'}). Sprawdź kolejność ulic albo dopisz ulicę łączącą.`);
  J.push(best)}

 for(let i=0;i<G.length;i++){const g=G[i];let s=i?J[i-1][1]:null,t=i<J.length?J[i][0]:null;
  if(s==null){if(from)s=txSnap(g,from,t,true);else if(t!=null){const D=txDij(txRev(g.dir),t);let far=null,fd=-1;D.forEach((d,id)=>{if(d>fd){fd=d;far=id}});if(fd<=0){const U=txDij(g.und,t);U.forEach((d,id)=>{if(d>fd){fd=d;far=id}})}s=far}}
  if(t==null){if(to)t=txSnap(g,to,s,false);else{const st0=s;const D=txDij(g.dir,st0);let far=null,fd=-1;D.forEach((d,id)=>{if(d>fd){fd=d;far=id}});if(fd<=0){const U=txDij(g.und,st0);U.forEach((d,id)=>{if(d>fd){fd=d;far=id}})}t=far}}
  if(s==null&&t==null){// jedna ulica, bez przystanków początkowego i końcowego: jej dwa najdalsze końce
   const ids=[...g.pos.keys()];const D0=txDij(g.und,ids[0]);let a=ids[0],ad=-1;D0.forEach((d,id)=>{if(d>ad){ad=d;a=id}});const D1=txDij(g.und,a);let b=a,bd2=-1;D1.forEach((d,id)=>{if(d>bd2){bd2=d;b=id}});s=a;t=b}
  let p=s===t?[s]:(txDij(g.dir,s,t)||txDij(g.und,s,t));if(!p)throw new Error(`Ulica „${names[i]}” nie jest ciągła między wjazdem a skrzyżowaniem z następną ulicą.`);
  legs.push(p.map(id=>g.pos.get(id)))}
 const out=[];legs.forEach(L=>L.forEach(p=>{if(!out.length||mdist(out[out.length-1],p)>.5)out.push(p)}));
 if(pin.from&&from&&mdist(out[0],from)>3)out.unshift(from);if(pin.to&&to&&mdist(out[out.length-1],to)>3)out.push(to);
 out.e0=from&&!pin.from?mdist(out[0],from)+60:80;out.e1=to&&!pin.to?mdist(out[out.length-1],to)+60:80;   // (zasięg przed początkiem i za końcem przebiegu, w którym szukane są przystanki)
 return out}
// przystanki przy przebiegu: odległość do 35 m (tramwaj 30 m), z peronów jednej nazwy w tym samym miejscu – po prawej stronie jazdy
function txStops(guide,kind,fromS,toS){const m=guide.map(p=>[p[1]*RX,p[0]*R0]),cum=[0];for(let i=1;i<m.length;i++)cum.push(cum[i-1]+Math.hypot(m[i][0]-m[i-1][0],m[i][1]-m[i-1][1]));
 const thr=kind==='tram'?30:35,la=guide.map(p=>p[0]),lo=guide.map(p=>p[1]),pd=(Math.max(guide.e0||80,guide.e1||80,thr)+20)/R0,pl=pd*R0/RX,bx=[Math.min(...la)-pd,Math.max(...la)+pd,Math.min(...lo)-pl,Math.max(...lo)+pl];
 const C=[];S.stops.forEach(s=>{if(!sKinds(s).includes(kind))return;const [a,b]=s.ll;if(a<bx[0]||a>bx[1]||b<bx[2]||b>bx[3])return;const px=b*RX,py=a*R0;let bd=1e9,al=0,side=0;
  for(let i=1;i<m.length;i++){const [x0,y0]=m[i-1],[x1,y1]=m[i],dx=x1-x0,dy=y1-y0,L2=dx*dx+dy*dy;if(!L2)continue;let t=((px-x0)*dx+(py-y0)*dy)/L2;
   // (przy końcach przebiegu także przystanki do 80 m przed jego początkiem i za końcem – peron przy samym krańcu)
   const Ls=Math.sqrt(L2);t=Math.max(i===1?-(guide.e0||80)/Ls:0,Math.min(i===m.length-1?1+(guide.e1||80)/Ls:1,t));const d=Math.hypot(px-(x0+t*dx),py-(y0+t*dy));
   if(d<bd){bd=d;al=cum[i-1]+t*Ls;side=dx*(py-y0)-dy*(px-x0)}}
  if(bd<=thr)C.push({s,d:bd,al,right:side<0,base:txF(s.name.replace(/\s+\d{2}$/,''))})});
 C.sort((a,b)=>a.al-b.al);const pick=[];
 for(let i=0;i<C.length;){let j=i+1;while(j<C.length&&C[j].base===C[i].base&&C[j].al-C[i].al<160)j++;const g=C.slice(i,j);i=j;
  const r=g.filter(x=>x.right).sort((a,b)=>a.d-b.d);let c=r[0];if(!c){const n=g.sort((a,b)=>a.d-b.d)[0];if(g.length===1&&n.d<=12)c=n}if(c)pick.push(c)}

// odcinki między przystankami: zwykłe trasowanie; gdy odbiega od podanych ulic o ponad 60 m – odcinek wzdłuż przebiegu ulic
async function txSegs(ids,guide,am,mode){const st=ids.map(stopOf),m=guide.map(p=>[p[1]*RX,p[0]*R0]),cum=[0];for(let i=1;i<m.length;i++)cum.push(cum[i-1]+Math.hypot(m[i][0]-m[i-1][0],m[i][1]-m[i-1][1]));

 const slice=(a0,a1)=>{const out=[];for(let i=1;i<m.length;i++){if(cum[i]<a0)continue;if(cum[i-1]>a1)break;const at=a=>{const f=(a-cum[i-1])/((cum[i]-cum[i-1])||1);return[guide[i-1][0]+(guide[i][0]-guide[i-1][0])*f,guide[i-1][1]+(guide[i][1]-guide[i-1][1])*f]};
  if(!out.length)out.push(at(Math.max(a0,cum[i-1])));out.push(at(Math.min(a1,cum[i])))}return out};
 const segs=[];let alt=0;
 for(let i=0;i+1<st.length;i++){const A=st[i],B=st[i+1];let r=null;try{r=await segRoute(A,B,am)}catch(e){}
  const pa=proj(A.ll),pb=proj(B.ll);let ok=r&&!r.bad&&r.pts&&r.pts.length>1;
  if(ok){let mx=0;const dp=densify(r.pts,25);for(let k=0;k<dp.length;k+=Math.max(1,dp.length>>8)){mx=Math.max(mx,proj(dp[k]).d)}ok=mx<=60&&segsLen([{pts:r.pts}])<=Math.max(1,pb.al-pa.al)*1.6+150}
  if(ok)segs.push({mode:r.mode,pts:r.pts});
  else{const p=pb.al>pa.al?slice(pa.al,pb.al):[];segs.push({mode,pts:[A.ll,...p,B.ll]});alt++}}

async function txBuild(spec,kind){const names=txSplit(spec.streets);if(!names.length)throw new Error('Wpisz co najmniej jedną ulicę.');

 const W=await txWays(names),guide=txGuide(W,names,fromS?fromS.ll:spec.fromLL,toS?toS.ll:spec.toLL,{from:!!fromS,to:!!toS}),sk=kind==='tram'?'tram':'bus',ids=txStops(guide,sk,fromS,toS);

function txStopBy(q,kind){const k=txF(String(q).trim()),num=(String(q).match(/\s(\d{2})$/)||[])[1],sk=kind==='tram'?'tram':'bus';
 const c=S.stops.filter(s=>sKinds(s).includes(sk)&&(txF(lab(s))===k||txF(s.name)===k||txF(s.name.replace(/\s+\d{2}$/,''))===k.replace(/\s+\d{2}$/,'')&&(!num||(s.num||'')===num)));

function txApply(l,b){l.stops=b.ids;l.segs=b.segs;l.auto=false;l.excl=[];l.wp=[l.segs[0].pts[0],...l.segs.map(x=>x.pts[x.pts.length-1])]}

 const circ=sp=>sp&&sp.from&&sp.to&&txF(sp.from.replace(/\s+\d{2}$/,''))===txF(sp.to.replace(/\s+\d{2}$/,''));

 const autoB=x=>{const sa=txStopBy(x.A.from||'',kind),sb=txStopBy(x.A.to||'',kind),c=circ(x.A);return{from:sb?lab(stopOf(oppStop(sb.id))):x.A.to||'',to:sa?lab(stopOf(oppStop(sa.id))):x.A.from||'',streets:txSplit(x.A.streets).reverse().join(' - '),c}};
 const draw=()=>{const g=D.g[cur.g];if(g.back==='same')g.back='auto';if(cur.k==='B'&&g.back!=='own')g.B=autoB(g);const sp=cur.k==='A'?g.A:g.B,ok=circ(g.A);
  const chip=(gi,k,t)=>`<button type="button" class="b flat vchip${cur.g===gi&&cur.k===k?' on':''}" data-gi="${gi}" data-k="${k}"><span class="vdot" style="background:${root.color}"></span>${t}</button>`;
  const rows=D.g.map((x,gi)=>{const c=circ(x.A),bk=x.back==='none'?`<span class="small vsame">${c?'bez kierunku przeciwnego':'tylko w jedną stronę'}</span><button type="button" class="b flat txBs" data-gi="${gi}">${ic('plus',14)}${c?'Kierunek przeciwny':'Powrót'}</button>`

   return `<div class="vgrp"><span class="vgl">${gi?esc(x.name||'Wariant '+gi):'Podstawowy'}</span>${chip(gi,'A',c?'KIERUNEK 1':'TAM')}${bk}${gi?`<button type="button" class="b ico flat txVx" data-gi="${gi}" title="Usuń wariant">${ic('trash',14)}</button>`:''}</div>`}).join('');
  box.innerHTML=`<div class="vpn vwar"><div class="vrow"><span class="grow"></span><button type="button" class="b flat txVadd">${ic('plus',14)}Wariant</button></div><div class="vchips">${rows}</div></div>
   <div class="lnSec txForm"><h4>${ic('route',14)}${cur.k==='B'?(ok?'Kierunek 2':'Powrót'):(ok?'Kierunek 1':'Tam')}${cur.g?' – '+esc(g.name||'Wariant '+cur.g):''}</h4>
    ${cur.g?`<div class="setg"><span class="lab">${ic('tag',14)}Nazwa</span><input class="txN" value="${esc(g.name||'')}" placeholder="Wariant ${cur.g}" aria-label="Nazwa wariantu"></div>`:''}
    <div class="setg"><span class="lab">${ic('pole',14)}Od przystanku</span><div class="txAc"><input class="txF" value="${esc(sp.from||'')}" autocomplete="off" aria-label="Przystanek początkowy" required></div></div>

  box.querySelector('.txVadd').onclick=()=>{keep();D.g.push({name:'',A:{from:D.g[0].A.from||'',to:D.g[0].A.to||''},back:'auto',B:{}});cur={g:D.g.length-1,k:'A'};draw();box.querySelector('.txS').focus()};
  const n=box.querySelector('.txN');if(n)n.oninput=()=>{D.g[cur.g].name=n.value;const lb=box.querySelectorAll('.vgl')[cur.g];if(lb)lb.textContent=n.value||'Wariant '+cur.g};
  box.querySelectorAll('.txF,.txT').forEach(acStops);
  box.querySelectorAll('.txF,.txT').forEach(i=>i.addEventListener('input',()=>{keep();const was=box.dataset.circ==='1',now=circ(D.g[cur.g].A);if(was!==now&&cur.k==='A'){box.dataset.circ=now?'1':'0';const a=document.activeElement&&document.activeElement.className;draw();const f=box.querySelector('.'+a);if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}}}));
  box.dataset.circ=circ(D.g[cur.g].A)?'1':'0'};
 // podpowiedzi nazw przystanków (lista w stylu aplikacji)
 const acStops=inp=>{let menu=null;const close=()=>{if(menu){menu.remove();menu=null}};
  const show=()=>{close();const q=txF(inp.value.trim());if(!q)return;const hits=stopNames.filter(n=>txF(n).includes(q)).slice(0,8);if(!hits.length||hits.length===1&&hits[0]===inp.value)return;
   menu=document.createElement('div');menu.className='fsMenu txMenu';const r=inp.getBoundingClientRect();menu.style.cssText=`position:fixed;left:${r.left}px;top:${r.bottom+2}px;width:${r.width}px;z-index:10050`;
   menu.innerHTML=hits.map(n=>`<button type="button">${esc(n)}</button>`).join('');menu.onmousedown=e=>{const b=e.target.closest('button');if(b){e.preventDefault();inp.value=b.textContent;close();inp.dispatchEvent(new Event('input'))}};document.body.appendChild(menu)};
  inp.addEventListener('input',show);inp.addEventListener('blur',()=>setTimeout(close,120));inp.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close()}})};
 draw();
 const check=()=>{keep();for(let i=0;i<D.g.length;i++){const x=D.g[i],nm=i?'„'+(x.name||'Wariant '+i)+'”':'trasy podstawowej',L=[['A',x.A]];if(x.back==='own')L.push(['B',x.B]);
   for(const [k,sp] of L){const w=k==='B'?(circ(x.A)?' (kierunek 2)':' (powrót)'):'';if(!sp.from||!sp.to){cur={g:i,k};draw();return `Podaj przystanek początkowy i końcowy ${nm}${w}.`}if(!txSplit(sp.streets).length){cur={g:i,k};draw();return `Wpisz ulice ${nm}${w} – rozdzielone myślnikiem, np. „Grunwaldzka - Hucisko”.`}}}return null};
 modal({title:'Trasa tekstowa – linia '+(root.num||''),body:box,cls:'lnModal txModal',cancelV:null,btns:[{t:'Anuluj',v:null},{t:'Wytycz trasę',c:'pri',fn:close=>{const e=check();if(e){say(e);return}close(true)}}]}).then(async ok=>{if(!ok){keep();root.txs=D;save();return}
  root.txs=D;save();
  try{say('Trasa tekstowa: wyszukiwanie ulic w OSM…');
   const anc=(sp,b)=>({...sp,fromLL:stopOf(b.ids[b.ids.length-1]).ll,toLL:stopOf(b.ids[0]).ll});
   // powrót tymi samymi ulicami: ulice odwrotnie, przystanki zamienione; linia okrężna – ten sam przystanek, ulice odwrotnie (druga strona)
   const rev=(sp,b)=>{const f=oppStop(b.ids[b.ids.length-1]),t=oppStop(b.ids[0]);return anc({from:sp.to,to:sp.from,fromId:f,toId:t,streets:txSplit(sp.streets).reverse().join(' - ')},b)};   // (krańce: perony dla przeciwnego kierunku, jeśli są)
   const out=[];
   for(const x of D.g){const a=await txBuild(x.A,kind);let bk=null;
    if(x.back==='own')bk=await txBuild(anc(x.B,a),kind);else if(x.back!=='none')bk=await txBuild(rev(x.A,a),kind).catch(e=>{dbg('Trasa tekstowa (powrót): '+e.message);return null});
    out.push({x,a,bk})}
   const l=root;S.lines=S.lines.filter(v=>v.par!==l.id);   // (warianty i powrót tej linii zastąpione nowymi)
   txApply(l,out[0].a);if(out[0].x.back==='none')l.oneway=true;else delete l.oneway;if(out[0].bk)txVar(l,l,out[0].bk,{back:true});
   out.slice(1).forEach(({x,a,bk})=>{const v=txVar(l,l,a,{name:x.name||'Wariant'});if(x.back==='none')v.oneway=true;if(bk)txVar(l,v,bk,{back:true})});
   S.sel=l.id;syncVariants();save();renderLines();redraw();const all=l.segs.flatMap(q=>q.pts);if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[30,30]});
   const pz=n=>n+' '+(n===1?'przystanek':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'przystanki':'przystanków');
   const alt=out.reduce((t,o)=>t+o.a.alt+(o.bk?o.bk.alt:0),0),miss=out.filter(o=>o.x.back!=='none'&&!o.bk).length;
   say(`Linia ${l.num}: ${pz(out[0].a.ids.length)}`+(out[0].bk?`, w drugą stronę ${pz(out[0].bk.ids.length)}`:'')+(out.length>1?`, wariantów: ${out.length-1}`:'')+'.'+(miss?` Nie udało się wytyczyć ${miss} tras powrotnych (szczegóły w diagnostyce).`:'')+(alt?` ${alt} odc. poprowadzono wzdłuż ulic, bo trasowanie wybierało inną drogę.`:''))}
  catch(e){dbg('Trasa tekstowa: '+(e.stack||e.message));say(e.message||String(e))}})}

 {const kept=S.lines.filter(isLk),k=kept.length;S.lines=kept;S.sel=null;if(!k)S.collapsed={};save();renderLines();redraw();say(k?`Usunięto ${n-k} linii; zablokowane (${k}) zostały.`:`Usunięto wszystkie linie (${n}).`)}};

function applyProject(o){
 const p=o&&o.project?o.project:o;
 if(!p||!Array.isArray(p.lines)||!Array.isArray(p.stops))throw new Error('To nie jest plik projektu sieci.');
 NOSAVE=false;S=p;if(cityKey()!==curCity)setCity(cityKey());S.custom=S.custom||[];S.infraRound={on:true,r:100};S.stops.forEach(x=>{if(!x.num)syncNum(x)});S.lines.forEach(l=>{l.stops=l.stops||[];l.segs=l.segs||[];l.wp=l.wp||[]});
 if(!S.lines.some(l=>l.id===S.sel))S.sel=null;
 save();rebuildGraphs();drawInfra();renderInfra();renderLines();renderStops();redraw();stopsTopUp();
 const all=S.lines.flatMap(l=>l.segs.flatMap(s=>s.pts));if(all.length)map.fitBounds(L.latLngBounds(all),{padding:[30,30]})}

 else if(FS.h)t=`Plik: „${FS.h.name}” · autozapis ${FS.auto?'włączony':'wyłączony'}${FS.last?' · ostatni zapis '+hhmm(FS.last):''}`;

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('gdn-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

 const close=()=>{if(M.hidden)return;M.hidden=true;if(open){open.btn.setAttribute('aria-expanded','false');open=null}};
 function enhance(sel){if(sel.dataset.fs||sel.multiple||sel.size>1||sel.hidden||sel.style.display==='none'||sel.closest('span[hidden]'))return;sel.dataset.fs='1';
  const btn=document.createElement('button');btn.type='button';btn.className='fsBtn '+(sel.className||'');btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');
  if(sel.title)btn.title=sel.title;const al=sel.getAttribute('aria-label');if(al)btn.setAttribute('aria-label',al);
  btn.innerHTML='<span class="fsT"></span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  sel.after(btn);sel.classList.add('fsHid');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');
  const sync=()=>{const o=sel.options[dI.get.call(sel)];btn.querySelector('.fsT').innerHTML=(o&&o.dataset.sym?fsSym(o.dataset.sym):'')+esc(o?o.textContent:'');btn.disabled=sel.disabled;btn.hidden=sel.hidden};sync();
  sel.addEventListener('change',sync);new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['disabled','hidden']});
  Object.defineProperty(sel,'value',{get(){return dV.get.call(this)},set(v){dV.set.call(this,v);sync()},configurable:true});
  Object.defineProperty(sel,'selectedIndex',{get(){return dI.get.call(this)},set(v){dI.set.call(this,v);sync()},configurable:true});
  const pick=i=>{if(i<0||i>=sel.options.length||sel.options[i].disabled||i===dI.get.call(sel))return;dI.set.call(sel,i);sync();sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))};
  btn.addEventListener('click',e=>{e.stopPropagation();if(open&&open.sel===sel){close();return}close();M.innerHTML='';
   [...sel.options].forEach((o,i)=>{if(o.hidden)return;const it=document.createElement('button');it.type='button';it.setAttribute('role','option');it.innerHTML=(o.dataset.sym?fsSym(o.dataset.sym):'')+esc(o.textContent);it.disabled=o.disabled;
    if(i===dI.get.call(sel)){it.className='on';it.setAttribute('aria-selected','true')}it.addEventListener('click',ev=>{ev.stopPropagation();close();pick(i);btn.focus()});M.appendChild(it)});
   M.hidden=false;open={sel,btn};btn.setAttribute('aria-expanded','true');const r=btn.getBoundingClientRect();M.style.minWidth=r.width+'px';const h=M.offsetHeight,w=M.offsetWidth;
   M.style.left=Math.max(4,Math.min(innerWidth-w-4,r.left))+'px';M.style.top=(r.bottom+4+h>innerHeight-4?Math.max(4,r.top-h-4):r.bottom+4)+'px';const on=M.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})});
  btn.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pick(dI.get.call(sel)+(e.key==='ArrowDown'?1:-1))}})}
 document.addEventListener('click',close);addEventListener('resize',close);document.addEventListener('scroll',e=>{if(!M.contains(e.target))close()},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 const all=r=>{if(r.tagName==='SELECT')enhance(r);else if(r.querySelectorAll)r.querySelectorAll('select').forEach(enhance)};
 all(document);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)all(n)}))).observe(document.body,{childList:true,subtree:true})})();
// ---- no zooming of the whole page with two fingers or Ctrl + the wheel (a touchpad's pinch): only the map and the schema zoom, by their own gestures
(function(){const own=t=>t&&t.closest&&t.closest('#map,svg,.leaflet-container');
 document.addEventListener('wheel',e=>{if(e.ctrlKey&&!own(e.target))e.preventDefault()},{passive:false,capture:true});
 document.addEventListener('touchmove',e=>{if(e.touches.length>1&&!own(e.target))e.preventDefault()},{passive:false,capture:true});
 ['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}))})();
// ---- no suggestions of the browser in the fields (what was typed before): every field set so, also those made later; the sign-in
// fields that ask for the password manager (username, passwords) keep it
(function(){const KEEP=/^(username|current-password|new-password|one-time-code)$/;
 const off=el=>{if(!el||el.type==='password'||KEEP.test(el.getAttribute('autocomplete')||''))return;if(el.getAttribute('autocomplete')!=='off')el.setAttribute('autocomplete','off')};
 const all=r=>{(r.querySelectorAll?r.querySelectorAll('input,textarea'):[]).forEach(off);if(r.matches&&r.matches('input,textarea'))off(r)};
 all(document);document.querySelectorAll('form').forEach(f=>f.setAttribute('autocomplete','off'));
 new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)all(n)}))).observe(document.documentElement,{childList:true,subtree:true});
 document.addEventListener('focusin',e=>{if(e.target&&e.target.matches&&e.target.matches('input,textarea'))off(e.target)},true)})();
</script></body></html>
